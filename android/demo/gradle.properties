# Standalone build settings for the SDK demo.
#
# These used to be inherited from the NayutalGuard app's gradle.properties.
# This project no longer sits under that build, so anything it needs has to be
# stated here — an outside-the-repo build is exactly what surfaced that.
# Kept minimal on purpose: only what this demo actually needs.

# Required: the SDK pulls in androidx.annotation, and AGP fails the build if
# AndroidX support is not enabled.
android.useAndroidX=true

# Each library's R class holds only its own resources.
android.nonTransitiveRClass=true

kotlin.code.style=official

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
